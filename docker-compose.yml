services:
  postgres:
    image: postgres:17-alpine
    container_name: vexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vexa
      POSTGRES_USER: vexa
      POSTGRES_PASSWORD: vexa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexa -d vexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vexa-postgres-data:/var/lib/postgresql/data

volumes:
  vexa-postgres-data:
